{% extends "base.html" %}
{% block content %}
{{ section.content | safe }}
<h2>Posts</h2>
<ul class="posts">
{% set posts = get_section(path="posts/_index.md") %}
{% for page in posts.pages %}
  <li><time>{{ page.date }}</time> <a href="{{ page.permalink }}">{{ page.title }}</a></li>
{% endfor %}
</ul>
{% endblock %}
