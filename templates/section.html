{% extends "base.html" %}
{% block title %}{{ section.title }} · {{ config.title }}{% endblock %}
{% block content %}
<h1>{{ section.title }}</h1>
<ul class="posts">
{% for page in section.pages %}
  <li><time>{{ page.date }}</time> <a href="{{ page.permalink }}">{{ page.title }}</a></li>
{% endfor %}
</ul>
{% endblock %}
