base_url = "https://goingrusting.github.io/RustingScience"
title = "RustingScience"
description = "Benchmarks, experiments and research notes from the Rusting projects. Big workloads on one consumer GPU, in Rust."
compile_sass = false
build_search_index = false
generate_feeds = true

[extra]
author = "Vasyl Trefilov"
github = "https://github.com/GoingRusting"
site = "https://goingrusting.github.io"

# Each post sets `[extra] project = "brain"`; that picks its material and 3D scene.
[extra.projects.engine]
name = "RustingEngine"
theme = "copper"
scene = "engine"
[extra.projects.brain]
name = "RustingBrain"
theme = "verdigris"
scene = "brain"
[extra.projects.shader]
name = "RustingShader"
theme = "cobalt"
scene = "shader"
